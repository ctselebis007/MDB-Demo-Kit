name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    env:
      # Optional repo secrets; Atlas/provider integration tests are skipped when unset.
      MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
      TEST_VOYAGE_KEY: ${{ secrets.TEST_VOYAGE_KEY }}
      TEST_OPENAI_KEY: ${{ secrets.TEST_OPENAI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6

      - name: Scaffolding tests
        run: npm test

      - name: Template api-types.ts is up to date
        working-directory: template
        run: |
          npm ci
          uv sync --directory api
          npm run gen:types
          git diff --exit-code -- web/src/core/api-types.ts || {
            echo "::error::template/web/src/core/api-types.ts is stale. Run 'npm run gen:types' in template/ and commit."
            exit 1
          }

      - name: Generate a demo with all modules
        run: npm run new -- ci-demo --modules search-lab,graph-view --out "$RUNNER_TEMP"

      - name: Lint
        working-directory: ${{ runner.temp }}/ci-demo
        run: npm run lint

      - name: Typecheck
        working-directory: ${{ runner.temp }}/ci-demo
        run: npm run typecheck

      - name: Test
        working-directory: ${{ runner.temp }}/ci-demo
        run: npm test

      - name: Build
        working-directory: ${{ runner.temp }}/ci-demo
        run: npm run build
